name: monmenu_manager
description: MonMenu Manager — Application mobile restaurant pour la gestion des commandes, menu et statistiques.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase (auth + realtime + storage)
  supabase_flutter: ^2.8.0

  # Stockage sécurisé des tokens JWT
  flutter_secure_storage: ^9.2.4

  # Navigation
  go_router: ^14.4.1

  # Gestion d'état
  provider: 6.1.5+1

  # HTTP
  http: 1.5.0

  # Stockage local (cache)
  hive: 2.2.3
  hive_flutter: 1.1.0

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Graphiques statistiques
  fl_chart: ^0.69.0

  # Notifications locales
  flutter_local_notifications: ^17.2.3

  # Utilitaires
  intl: ^0.19.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  package_info_plus: ^8.1.3
  connectivity_plus: ^6.1.3

  # Paiement — upload preuve (compression, stockage local, mime)
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5
  mime: ^1.0.6

  # UI helpers
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  qr_flutter: ^4.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
